<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reliquats Fleux</title>

  <!-- ICÔNE DE L'APPLICATION -->
  <link rel="icon" type="image/png" href="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary: #ff6b00;
      --primary-hover: #e05e00;
      --secondary: #1e293b;
      --bg: #090d16;
      --card-bg: #131c2e;
      --text: #f8fafc;
      --border: #1e293b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* --- ACCUEIL --- */
    #home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      text-align: center;
      background: radial-gradient(circle at 50% 20%, #1a2642 0%, var(--bg) 70%);
    }

    .logo-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .home-logo-img {
      width: 85vw !important;
      max-width: 420px !important;
      height: auto !important;
      max-height: 180px !important;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(255,255,255,0.15));
      display: block;
    }

    .app-subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 480px;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    .btn-start {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4);
      transition: all 0.2s ease;
    }

    /* --- APPLICATION --- */
    #app-screen {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
      gap: 0.5rem;
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      margin-right: 1rem;
      background: white;
      padding: 0.4rem 0.75rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      height: 65px;
    }

    .header-brand a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 100%;
      height: 100%;
    }

    .header-brand img {
      height: 52px !important;
      width: auto !important;
      max-width: 100%;
      object-fit: contain;
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .btn-nav-home {
      background: transparent;
      border: 1px solid var(--border);
      color: #94a3b8;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }

    .btn-menu-hamburger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      min-width: 200px;
      overflow: hidden;
      margin-top: 0.4rem;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      padding: 0.75rem 1rem;
      text-align: left;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
      transition: background 0.2s ease;
    }

    .dropdown-item.danger {
      color: #f43f5e;
    }

    .dropdown-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .search-box input {
      flex: 1;
      background: rgba(255,255,255,0.03);
    }

    .btn-search {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .photo-box-container {
      background: rgba(255,255,255,0.02);
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px dashed var(--border);
      margin-bottom: 1rem;
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    .photo-preview-wrapper {
      position: relative;
      margin-bottom: 0.75rem;
      display: none;
    }

    .photo-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
    }

    .btn-suppr-photo-interne {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(244, 63, 94, 0.9);
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .camera-controls {
      display: flex;
      gap: 0.5rem;
    }

    button.btn-main {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    button.btn-secondary {
      background-color: #334155;
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .export-filter-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
      background: rgba(255,255,255,0.02);
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .export-filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .export-actions-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-date-custom {
      flex: 1;
      min-width: 140px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      background: rgba(255,255,255,0.03);
    }

    button.btn-pdf {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .liste-commandes {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .commande-item-compact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .commande-item-compact:hover {
      background: rgba(255,255,255,0.05);
    }

    .commande-main-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-grow: 1;
    }

    .commande-num-badge {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--primary);
    }

    .commande-date-compact {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .commande-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-edit-small {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete-small {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: #f43f5e;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* MODAL ZOOM */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 95%;
      margin: auto;
    }

    .modal-images-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .modal-photo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .modal-images-row img {
      max-width: 40vw;
      max-height: 55vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .modal-ref-badge {
      background: var(--primary);
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .modal-images-row {
        flex-direction: column;
      }
      .modal-images-row img {
        max-width: 90vw;
        max-height: 35vh;
      }
    }

    .modal-notes {
      color: white;
      background: rgba(19, 28, 46, 0.9);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      max-width: 500px;
      text-align: center;
      font-size: 0.95rem;
      border: 1px solid var(--border);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white;
        color: black;
      }
      .print-title {
        font-size: 22px;
        color: #ff6b00;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .print-subtitle {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 20px;
        border-bottom: 2px solid #ff6b00;
        padding-bottom: 10px;
      }
      .print-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .print-card {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        page-break-inside: avoid;
        background: #ffffff;
      }
      .print-card h3 {
        font-size: 16px;
        color: #0f172a;
        margin-bottom: 4px;
      }
      .print-card .date {
        font-size: 11px;
        color: #64748b;
        margin-bottom: 8px;
      }
      .print-photos-flex {
        display: flex;
        gap: 8px;
      }
      .print-photo-print-item {
        width: 50%;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .print-photos-flex img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
      }
      .print-ref-label {
        font-size: 10px;
        font-weight: bold;
        color: #ff6b00;
        background: #f8fafc;
        padding: 2px;
        border-radius: 4px;
        text-align: center;
      }
      .print-card .notes {
        font-size: 12px;
        color: #334155;
        margin-top: 6px;
        font-style: italic;
      }
    }
  </style>
</head>
<body>

  <!-- ACCUEIL -->
  <div id="home-screen">
    <div class="logo-container">
      <a href="https://servimg.com/view/11318970/309" target="_blank">
        <img class="home-logo-img" src="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg" style="border:0;" alt="Reliquats Fleux Logo" />
      </a>
    </div>
    <p class="app-subtitle">Prenez en photo vos articles manquants et suivez vos numéros de commande.</p>
    <button class="btn-start" id="btnCommencer">🚀 Lancer les reliquats</button>
  </div>

  <!-- APPLICATION -->
  <div id="app-screen">
    <header>
      <div class="header-brand">
        <a href="https://servimg.com/view/11318970/309" target="_blank">
          <img src="https://i49.servimg.com/u/f49/11/31/89/70/img_2010.jpg" style="border:0;" alt="Reliquats Fleux Logo" />
        </a>
      </div>
      
      <div class="header-controls">
        <button class="btn-nav-home" id="btnRetourAccueil">🏠 Accueil</button>
        <button class="btn-menu-hamburger" id="btnMenu" title="Menu options">☰</button>
        
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item danger" id="btnViderHistorique">
            🗑️ Vider l'historique
          </button>
        </div>
      </div>
    </header>

    <!-- SECTION RECHERCHE -->
    <section class="card" style="padding: 1rem;">
      <div class="search-box">
        <input type="text" id="recherche" placeholder="🔍 Rechercher par numéro..." autocomplete="off">
        <button type="button" class="btn-search" id="btnLancerRecherche">Rechercher</button>
      </div>
    </section>

    <!-- NOUVEAU RELIQUAT -->
    <section class="card" id="sectionPreparation">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2 id="formTitle" style="font-size: 1.1rem; color:var(--primary);">Nvx reliquats</h2>
        <button type="button" id="btnNouvelleCommande" style="background:var(--primary); color:white; border:none; padding:0.4rem 0.8rem; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.85rem;">➕ Nvx reliquats</button>
      </div>

      <div class="form-group">
        <label for="numeroCommande">N° de Commande</label>
        <input type="text" id="numeroCommande" name="no_autofill_cmd" autocomplete="off" placeholder="Ex: S-103567">
      </div>

      <!-- PHOTO 1 -->
      <div class="photo-box-container">
        <label>📸 Photo 1 (Article manquant)</label>
        <div id="previewWrapper1" class="photo-preview-wrapper">
          <img id="photoPreview1" class="photo-preview" alt="Aperçu Photo 1">
          <button type="button" id="btnSupprPhoto1" class="btn-suppr-photo-interne">❌ Supprimer cette photo</button>
        </div>
        
        <input type="file" id="fileGallery1" accept="image/*" style="display: none;">
        <input type="file" id="fileCamera1" accept="image/*" capture="environment" style="display: none;">
        
        <div class="camera-controls">
          <button type="button" class="btn-secondary" id="btnGalerie1">📁 Galerie 1</button>
          <button type="button" class="btn-secondary" id="btnPhotoDirecte1">📸 Photo 1</button>
        </div>

        <div class="form-group" style="margin-top: 0.75rem; margin-bottom: 0;">
          <label for="ref1">Référence article (Photo 1)</label>
          <input type="text" id="ref1" placeholder="Ex: Xdc-3468" autocomplete="off">
        </div>
      </div>

      <!-- PHOTO 2 -->
      <div class="photo-box-container">
        <label>📸 Photo 2 (Autre angle / Étiquette) - Optionnelle</label>
        <div id="previewWrapper2" class="photo-preview-wrapper">
          <img id="photoPreview2" class="photo-preview" alt="Aperçu Photo 2">
          <button type="button" id="btnSupprPhoto2" class="btn-suppr-photo-interne">❌ Supprimer cette photo</button>
        </div>
        
        <input type="file" id="fileGallery2" accept="image/*" style="display: none;">
        <input type="file" id="fileCamera2" accept="image/*" capture="environment" style="display: none;">
        
        <div class="camera-controls">
          <button type="button" class="btn-secondary" id="btnGalerie2">📁 Galerie 2</button>
          <button type="button" class="btn-secondary" id="btnPhotoDirecte2">📸 Photo 2</button>
        </div>

        <div class="form-group" style="margin-top: 0.75rem; margin-bottom: 0;">
          <label for="ref2">Référence article (Photo 2)</label>
          <input type="text" id="ref2" placeholder="Ex: Ytr-9812" autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Remarques (optionnel)</label>
        <textarea id="notes" rows="2" placeholder="Ex: Produit fragile..." autocomplete="off"></textarea>
      </div>

      <div style="display:flex; gap:0.5rem;">
        <button class="btn-main" id="btnEnregistrer">Enregistrer les reliquats</button>
        <button class="btn-secondary" id="btnAnnulerEdit" style="display:none; width:auto;">Annuler</button>
      </div>
    </section>

    <!-- HISTORIQUE DES PREUVES -->
    <section class="card">
      <div class="section-header">
        <h2>Historique des Preuves</h2>
      </div>

      <div class="export-filter-container">
        <span class="export-filter-label">📅 Filtrer par date pour l'export (Optionnel) :</span>
        <div class="export-actions-row">
          <input type="date" id="dateFiltreExport" class="input-date-custom">
          <button class="btn-pdf" id="btnExportPDF">📄 Exporter PDF</button>
        </div>
      </div>

      <div class="liste-commandes" id="galerieCommandes"></div>
    </section>
  </div>

  <div id="print-area"></div>

  <!-- MODAL ZOOM -->
  <div id="imageModal" class="modal">
    <span class="modal-close" id="closeModal">&times;</span>
    <div class="modal-content-container">
      <div class="modal-images-row" id="modalImagesRow"></div>
      <div id="modalNotes" class="modal-notes" style="display: none;"></div>
    </div>
  </div>

  <!-- SDK FIREBASE COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyABQ02OsMbEwLMl7k1hUMdQOCQQi1RdDVE",
      authDomain: "reliquats-fleux.firebaseapp.com",
      databaseURL: "https://reliquats-fleux-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "reliquats-fleux",
      storageBucket: "reliquats-fleux.firebasestorage.app",
      messagingSenderId: "591953313777",
      appId: "1:591953313777:web:c95b2e8aab6c9492f7ce50",
      measurementId: "G-Z8VKEX2MPV"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const homeScreen = document.getElementById('home-screen');
    const appScreen = document.getElementById('app-screen');
    const btnCommencer = document.getElementById('btnCommencer');
    const btnRetourAccueil = document.getElementById('btnRetourAccueil');
    const sectionPreparation = document.getElementById('sectionPreparation');

    const btnMenu = document.getElementById('btnMenu');
    const dropdownMenu = document.getElementById('dropdownMenu');

    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
    });

    btnCommencer.addEventListener('click', () => {
      homeScreen.style.display = 'none';
      appScreen.style.display = 'block';
      reinitialiserFormulaire();
    });

    btnRetourAccueil.addEventListener('click', () => {
      reinitialiserFormulaire();
      inputRecherche.value = "";
      sectionPreparation.style.display = 'block';
      afficherGalerie();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    let commandes = [];
    let imageCaptureeData1 = "";
    let imageCaptureeData2 = "";
    let modeEditionId = null;

    const inputNumero = document.getElementById('numeroCommande');
    const inputRef1 = document.getElementById('ref1');
    const inputRef2 = document.getElementById('ref2');
    const inputNotes = document.getElementById('notes');
    const btnNouvelleCommande = document.getElementById('btnNouvelleCommande');
    
    const photoPreview1 = document.getElementById('photoPreview1');
    const previewWrapper1 = document.getElementById('previewWrapper1');
    const btnSupprPhoto1 = document.getElementById('btnSupprPhoto1');
    const fileGallery1 = document.getElementById('fileGallery1');
    const fileCamera1 = document.getElementById('fileCamera1');
    const btnGalerie1 = document.getElementById('btnGalerie1');
    const btnPhotoDirecte1 = document.getElementById('btnPhotoDirecte1');

    const photoPreview2 = document.getElementById('photoPreview2');
    const previewWrapper2 = document.getElementById('previewWrapper2');
    const btnSupprPhoto2 = document.getElementById('btnSupprPhoto2');
    const fileGallery2 = document.getElementById('fileGallery2');
    const fileCamera2 = document.getElementById('fileCamera2');
    const btnGalerie2 = document.getElementById('btnGalerie2');
    const btnPhotoDirecte2 = document.getElementById('btnPhotoDirecte2');

    const btnEnregistrer = document.getElementById('btnEnregistrer');
    const btnAnnulerEdit = document.getElementById('btnAnnulerEdit');
    const formTitle = document.getElementById('formTitle');
    const galerieCommandes = document.getElementById('galerieCommandes');
    const inputRecherche = document.getElementById('recherche');
    const btnLancerRecherche = document.getElementById('btnLancerRecherche');
    const btnViderHistorique = document.getElementById('btnViderHistorique');
    const btnExportPDF = document.getElementById('btnExportPDF');
    const dateFiltreExport = document.getElementById('dateFiltreExport');

    const modal = document.getElementById('imageModal');
    const modalImagesRow = document.getElementById('modalImagesRow');
    const modalNotes = document.getElementById('modalNotes');
    const closeModal = document.getElementById('closeModal');

    // ÉCOUTE FIREBASE FIABLE
    db.ref('commandes').on('value', (snapshot) => {
      const data = snapshot.val();
      commandes = [];
      if (data) {
        Object.keys(data).forEach(key => {
          commandes.push(data[key]);
        });
        commandes.sort((a, b) => b.id - a.id);
      }
      afficherGalerie(inputRecherche.value);
    }, (error) => {
      alert("Erreur de lecture Firebase : " + error.message);
    });

    function compresserImage(dataUrl, callback) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDimension = 1200;

        if (width > height && width > maxDimension) {
          height *= maxDimension / width;
          width = maxDimension;
        } else if (height > maxDimension) {
          width *= maxDimension / height;
          height = maxDimension;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = dataUrl;
    }

    btnGalerie1.addEventListener('click', () => fileGallery1.click());
    btnPhotoDirecte1.addEventListener('click', () => fileCamera1.click());

    function chargerFichier1(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          compresserImage(event.target.result, (imageCompressée) => {
            imageCaptureeData1 = imageCompressée;
            photoPreview1.src = imageCaptureeData1;
            previewWrapper1.style.display = 'block';
          });
        };
        reader.readAsDataURL(file);
      }
    }
    fileGallery1.addEventListener('change', chargerFichier1);
    fileCamera1.addEventListener('change', chargerFichier1);

    btnSupprPhoto1.addEventListener('click', () => {
      imageCaptureeData1 = "";
      photoPreview1.src = "";
      previewWrapper1.style.display = 'none';
      fileGallery1.value = "";
      fileCamera1.value = "";
    });

    btnGalerie2.addEventListener('click', () => fileGallery2.click());
    btnPhotoDirecte2.addEventListener('click', () => fileCamera2.click());

    function chargerFichier2(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          compresserImage(event.target.result, (imageCompressée) => {
            imageCaptureeData2 = imageCompressée;
            photoPreview2.src = imageCaptureeData2;
            previewWrapper2.style.display = 'block';
          });
        };
        reader.readAsDataURL(file);
      }
    }
    fileGallery2.addEventListener('change', chargerFichier2);
    fileCamera2.addEventListener('change', chargerFichier2);

    btnSupprPhoto2.addEventListener('click', () => {
      imageCaptureeData2 = "";
      photoPreview2.src = "";
      previewWrapper2.style.display = 'none';
      fileGallery2.value = "";
      fileCamera2.value = "";
    });

    btnEnregistrer.addEventListener('click', () => {
      const numero = inputNumero.value.trim();
      const ref1 = inputRef1.value.trim();
      const ref2 = inputRef2.value.trim();
      const notes = inputNotes.value.trim();

      if (!numero || !imageCaptureeData1) {
        alert("Veuillez renseigner un numéro de commande et au moins la Photo 1.");
        return;
      }

      btnEnregistrer.disabled = true;
      btnEnregistrer.textContent = "Enregistrement...";

      const idObjet = modeEditionId !== null ? modeEditionId : Date.now();
      const commandeData = {
        id: idObjet,
        numero: numero,
        photo: imageCaptureeData1,
        ref1: ref1,
        photo2: imageCaptureeData2,
        ref2: ref2,
        notes: notes,
        date: modeEditionId !== null ? commandes.find(c => c.id === modeEditionId).date : new Date().toLocaleString('fr-FR')
      };

      db.ref('commandes/' + idObjet).set(commandeData)
        .then(() => {
          reinitialiserFormulaire();
          btnEnregistrer.disabled = false;
        })
        .catch((error) => {
          btnEnregistrer.disabled = false;
          btnEnregistrer.textContent = "Enregistrer les reliquats";
          alert("❌ ÉCHEC FIREBASE : " + error.message);
        });
    });

    function reinitialiserFormulaire() {
      modeEditionId = null;
      inputNumero.value = "";
      inputRef1.value = "";
      inputRef2.value = "";
      imageCaptureeData1 = "";
      imageCaptureeData2 = "";
      previewWrapper1.style.display = 'none';
      previewWrapper2.style.display = 'none';
      inputNotes.value = "";
      fileGallery1.value = "";
      fileCamera1.value = "";
      fileGallery2.value = "";
      fileCamera2.value = "";
      btnEnregistrer.textContent = "Enregistrer les reliquats";
      btnEnregistrer.disabled = false;
      btnAnnulerEdit.style.display = "none";
      formTitle.textContent = "Nvx reliquats";
    }

    btnNouvelleCommande.addEventListener('click', () => {
      reinitialiserFormulaire();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    btnAnnulerEdit.addEventListener('click', reinitialiserFormulaire);

    window.editerCommande = function(id, event) {
      if (event) event.stopPropagation();
      const item = commandes.find(c => c.id === id);
      if (!item) return;

      inputRecherche.value = "";
      sectionPreparation.style.display = 'block';

      modeEditionId = id;
      inputNumero.value = item.numero;
      inputRef1.value = item.ref1 || "";
      inputRef2.value = item.ref2 || "";
      inputNotes.value = item.notes || "";
      
      imageCaptureeData1 = item.photo || "";
      imageCaptureeData2 = item.photo2 || "";
      
      if (imageCaptureeData1) {
        photoPreview1.src = imageCaptureeData1;
        previewWrapper1.style.display = 'block';
      } else {
        previewWrapper1.style.display = 'none';
      }

      if (imageCaptureeData2) {
        photoPreview2.src = imageCaptureeData2;
        previewWrapper2.style.display = 'block';
      } else {
        previewWrapper2.style.display = 'none';
      }

      btnEnregistrer.textContent = "💾 Sauvegarder les modifications";
      btnAnnulerEdit.style.display = "inline-block";
      formTitle.textContent = "✏️ Modifier le reliquat " + item.numero;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.supprimerCommande = function(id, event) {
      if (event) event.stopPropagation();
      const item = commandes.find(c => c.id === id);
      if (!item) return;

      if (confirm(`Voulez-vous vraiment supprimer le reliquat ${item.numero} ?`)) {
        db.ref('commandes/' + id).remove()
          .then(() => {
            if (modeEditionId === id) reinitialiserFormulaire();
          });
      }
    };

    btnViderHistorique.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      if (confirm("Voulez-vous vraiment effacer TOUT l'historique de la base de données ?")) {
        db.ref('commandes').remove()
          .then(() => {
            reinitialiserFormulaire();
          });
      }
    });

    function afficherGalerie(filtre = "") {
      galerieCommandes.innerHTML = "";
      const liste = commandes.filter(c => {
        const numMatch = c.numero.toLowerCase().includes(filtre.toLowerCase());
        const ref1Match = c.ref1 && c.ref1.toLowerCase().includes(filtre.toLowerCase());
        const ref2Match = c.ref2 && c.ref2.toLowerCase().includes(filtre.toLowerCase());
        return numMatch || ref1Match || ref2Match;
      });

      if (liste.length === 0) {
        galerieCommandes.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:1rem;">Aucun reliquat trouvé.</p>`;
        return;
      }

      liste.forEach(cmd => {
        const item = document.createElement('div');
        item.className = 'commande-item-compact';
        item.onclick = () => ouvrirModal(cmd);
        
        let count = 0;
        if (cmd.photo) count++;
        if (cmd.photo2) count++;
        const nbPhotosText = count === 2 ? "📷📷 (2 photos)" : "📷 (1 photo)";

        item.innerHTML = `
          <div class="commande-main-btn">
            <span>${nbPhotosText}</span>
            <div>
              <div class="commande-num-badge">N° ${cmd.numero}</div>
              <div class="commande-date-compact">${cmd.date}</div>
            </div>
          </div>
          <div class="commande-actions">
            <button class="btn-edit-small" onclick="editerCommande(${cmd.id}, event)">✏️ Modifier</button>
            <button class="btn-delete-small" onclick="supprimerCommande(${cmd.id}, event)">❌</button>
          </div>
        `;
        galerieCommandes.appendChild(item);
      });
    }

    window.ouvrirModal = function(cmd) {
      modal.style.display = "flex";
      modalImagesRow.innerHTML = "";

      if (cmd.photo) {
        const box1 = document.createElement('div');
        box1.className = 'modal-photo-box';
        box1.innerHTML = `
          <img src="${cmd.photo}" alt="Photo 1">
          ${cmd.ref1 ? `<div class="modal-ref-badge">Réf: ${cmd.ref1}</div>` : ''}
        `;
        modalImagesRow.appendChild(box1);
      }

      if (cmd.photo2) {
        const box2 = document.createElement('div');
        box2.className = 'modal-photo-box';
        box2.innerHTML = `
          <img src="${cmd.photo2}" alt="Photo 2">
          ${cmd.ref2 ? `<div class="modal-ref-badge">Réf: ${cmd.ref2}</div>` : ''}
        `;
        modalImagesRow.appendChild(box2);
      }

      if (cmd.notes && cmd.notes.trim() !== "") {
        modalNotes.textContent = "💬 " + cmd.notes;
        modalNotes.style.display = "block";
      } else {
        modalNotes.style.display = "none";
      }
    };

    closeModal.addEventListener('click', () => modal.style.display = "none");
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = "none";
    });

    function executerRecherche() {
      const valeur = inputRecherche.value.trim();
      if (valeur !== "") {
        sectionPreparation.style.display = 'none';
      } else {
        sectionPreparation.style.display = 'block';
      }
      afficherGalerie(valeur);
    }

    btnLancerRecherche.addEventListener('click', executerRecherche);
    inputRecherche.addEventListener('input', executerRecherche);
    inputRecherche.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executerRecherche();
    });

    btnExportPDF.addEventListener('click', () => {
      const dateSelect = dateFiltreExport.value;
      let listeAExporter = commandes;
      let titreExport = "Historique Complet des Reliquats";

      if (dateSelect) {
        const parts = dateSelect.split('-');
        const dateFormatee = `${parts[2]}/${parts[1]}/${parts[0]}`;
        
        listeAExporter = commandes.filter(cmd => cmd.date.startsWith(dateFormatee));
        titreExport = `Historique Reliquats - Date : ${dateFormatee}`;

        if (listeAExporter.length === 0) {
          alert(`Aucun reliquat trouvé pour la date du ${dateFormatee}.`);
          return;
        }
      } else {
        if (commandes.length === 0) {
          alert("L'historique est vide, aucun document à exporter.");
          return;
        }
      }

      const printArea = document.getElementById('print-area');
      const dateHeureExport = new Date().toLocaleString('fr-FR');

      let html = `
        <div class="print-title">${titreExport}</div>
        <div class="print-subtitle">Document généré le ${dateHeureExport} - Total : ${listeAExporter.length} enregistrement(s)</div>
        <div class="print-grid">
      `;

      listeAExporter.forEach(cmd => {
        html += `
          <div class="print-card">
            <h3>Commande : ${cmd.numero}</h3>
            <div class="date">Date : ${cmd.date}</div>
            <div class="print-photos-flex">
              ${cmd.photo ? `
                <div class="print-photo-print-item">
                  <img src="${cmd.photo}" alt="Photo 1">
                  ${cmd.ref1 ? `<div class="print-ref-label">Réf: ${cmd.ref1}</div>` : ''}
                </div>
              ` : ''}
              ${cmd.photo2 ? `
                <div class="print-photo-print-item">
                  <img src="${cmd.photo2}" alt="Photo 2">
                  ${cmd.ref2 ? `<div class="print-ref-label">Réf: ${cmd.ref2}</div>` : ''}
                </div>
              ` : ''}
            </div>
            ${cmd.notes ? `<div class="notes">💬 ${cmd.notes}</div>` : ''}
          </div>
        `;
      });

      html += `</div>`;
      printArea.innerHTML = html;

      window.print();
    });
  </script>
</body>
</html>
