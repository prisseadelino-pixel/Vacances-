<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Vacances Partagée</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --danger: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .header { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .header-logo { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; }
        .header h1 { font-size: 1.1rem; margin: 0; color: var(--primary); text-align: center; flex-grow: 1; }
        .save-btn { background-color: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .header-actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .reset-btn { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; }
        .add-cat-btn { background: var(--primary); color: white; border: none; padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; }
        .status-text { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
        .progress-container { background-color: #e2e8f0; border-radius: 10px; height: 8px; width: 100%; overflow: hidden; margin-top: 8px; }
        .progress-bar { background-color: #22c55e; height: 100%; width: 0%; transition: width 0.3s ease; }
        .category-header { display: flex; align-items: center; margin: 20px 0 10px 0; padding-bottom: 5px; border-bottom: 2px solid var(--primary); gap: 5px; }
        .category-title { font-size: 1rem; font-weight: bold; color: var(--primary); flex-grow: 1; cursor: pointer; }
        .add-item-btn { background: var(--primary); color: white; border: none; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; cursor: pointer; }
        .item { display: flex; align-items: center; background: var(--card); padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .item input[type="checkbox"] { width: 18px; height: 18px; margin-right: 10px; flex-shrink: 0; cursor: pointer; }
        .item-text { flex-grow: 1; font-size: 0.9rem; cursor: pointer; }
        .item-details { display: block; font-size: 0.75rem; color: var(--text-muted); }
        .item.checked { opacity: 0.5; background-color: #f1f5f9; }
        .item.checked .item-title { text-decoration: line-through; }
        .action-btn { background: none; border: none; font-size: 0.9rem; cursor: pointer; padding: 4px; }
        
        /* Modale personnalisée */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 300px; text-align: center; }
        .modal-actions { display: flex; justify-content: space-around; margin-top: 15px; }
        .btn-modal { padding: 10px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-yes { background: var(--danger); color: white; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <img src="logo.png" alt="Logo" class="header-logo">
            <h1>Vacances</h1>
            <button class="save-btn" id="save-btn-el">✓ Sauvegardé</button>
        </div>
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="header-actions">
            <button class="reset-btn" onclick="window.confirmAction('Tout décocher ?', window.uncheckAll)">Tout décocher</button>
            <button class="add-cat-btn" onclick="window.addCategory()">+ Catégorie</button>
        </div>
        <div id="status-text" class="status-text">Chargement...</div>
    </div>

    <div id="checklist-container"></div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal">
            <p id="modal-message">Êtes-vous sûr ?</p>
            <div class="modal-actions">
                <button class="btn-modal" onclick="window.closeModal()">Annuler</button>
                <button class="btn-modal btn-yes" id="btn-confirm-yes">Confirmer</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Action effectuée.</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCHefIbY5LYOOlsevUhwYn8frlYsA7K9yw", authDomain: "vacances-22b22.firebaseapp.com", projectId: "vacances-22b22", storageBucket: "vacances-22b22.firebasestorage.app", messagingSenderId: "63081073246", appId: "1:63081073246:web:fb943c8b7d80d4d3e802cf", measurementId: "G-X4WXTSLZB9" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "vacances", "checklist");

        let currentData = { checks: {}, structure: [] };

        window.closeModal = () => document.getElementById('custom-modal').style.display = 'none';
        window.confirmAction = (msg, callback) => {
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('btn-confirm-yes').onclick = () => { callback(); window.closeModal(); };
            document.getElementById('custom-modal').style.display = 'flex';
        };

        function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }

        onSnapshot(docRef, (docSnap) => {
            currentData = docSnap.exists() ? docSnap.data() : { checks: {}, structure: [] };
            renderChecklist();
        });

        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';
            let total = 0, checked = 0;
            currentData.structure.forEach((cat, catIdx) => {
                const div = document.createElement('div');
                div.innerHTML = `<div class="category-header">
                    <span class="category-title" onclick="window.editCategory(${catIdx})">✏️ ${cat.category}</span>
                    <button class="add-item-btn" onclick="window.addItem(${catIdx})">+ Élément</button>
                    <button class="action-btn" onclick="window.confirmAction('Supprimer la catégorie ?', () => window.deleteCategory(${catIdx}))">🗑️</button>
                </div>`;
                container.appendChild(div);
                cat.items.forEach((item, itemIdx) => {
                    total++;
                    const key = `k_${catIdx}_${itemIdx}`;
                    if (currentData.checks[key]) checked++;
                    const itemEl = document.createElement('div');
                    itemEl.className = `item ${currentData.checks[key] ? 'checked' : ''}`;
                    itemEl.innerHTML = `<input type="checkbox" ${currentData.checks[key]?'checked':''} onchange="window.toggle('${key}', this.checked)">
                        <div class="item-text" onclick="window.toggle('${key}', !${!!currentData.checks[key]})"><b>${item.title}</b><span class="item-details">${item.details}</span></div>
                        <button class="action-btn" onclick="window.editItem(${catIdx}, ${itemIdx})">✏️</button>
                        <button class="action-btn" onclick="window.confirmAction('Supprimer l\'élément ?', () => window.deleteItem(${catIdx}, ${itemIdx}))">🗑️</button>`;
                    container.appendChild(itemEl);
                });
            });
            document.getElementById('progress-bar').style.width = total ? (checked/total)*100 + '%' : '0%';
            document.getElementById('status-text').innerText = `${checked} / ${total} éléments (${total ? Math.round((checked/total)*100) : 0}%)`;
        }

        window.toggle = async (k, v) => { currentData.checks[k] = v; renderChecklist(); await setDoc(docRef, currentData, { merge: true }); };
        window.addCategory = () => { const n = prompt("Nom de la catégorie :"); if(n) { currentData.structure.push({category: n, items: []}); save(); } };
        window.editCategory = (c) => { const n = prompt("Renommer :", currentData.structure[c].category); if(n) { currentData.structure[c].category = n; save(); } };
        window.deleteCategory = (c) => { currentData.structure.splice(c, 1); save(); };
        window.addItem = (c) => { const t = prompt("Nom :"); if(t) { currentData.structure[c].items.push({title: t, details: ""}); save(); } };
        window.editItem = (c, i) => { const item = currentData.structure[c].items[i]; const t = prompt("Nom", item.title); if(t) { item.title = t; save(); } };
        window.deleteItem = (c, i) => { currentData.structure[c].items.splice(i, 1); save(); };
        window.uncheckAll = () => { currentData.checks = {}; save(); };
        document.getElementById('save-btn-el').onclick = () => showToast("Synchronisé en temps réel.");
        
        async function save() { renderChecklist(); await setDoc(docRef, currentData, { merge: true }); showToast("Sauvegardé !"); }
    </script>
</body>
</html>
